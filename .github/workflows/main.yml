name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies and audit NuGet packages
        run: dotnet restore DotnetBaseApi.sln --property:NuGetAudit=true --property:NuGetAuditMode=all

      - name: Build
        run: dotnet build DotnetBaseApi.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true

      - name: Run tests
        id: tests
        run: >-
          dotnet test DotnetBaseApi.sln
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Show test results in job summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: .NET tests
          path: ${{ runner.temp }}/test-results/**/*.trx
          reporter: dotnet-trx
          use-actions-summary: "true"
          list-suites: failed
          list-tests: failed
          fail-on-empty: "true"
