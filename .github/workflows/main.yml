name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Build, test, and publish check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies and audit NuGet packages
        run: dotnet restore DotnetBaseApi.sln --property:NuGetAudit=true --property:NuGetAuditMode=all

      - name: Build
        run: dotnet build DotnetBaseApi.sln --configuration Release --no-restore --property:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >-
          dotnet test DotnetBaseApi.sln
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 7
